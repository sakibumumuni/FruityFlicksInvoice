<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.jpg') }}" type="image/x-icon">
    <title>Your Invoice</title>
</head>
<body class="invoice-container">
    <!-- <div class="invoice-container"> -->
        <h1>Create New Incoice</h1>
        <p>Fill in the details below to generate a new invoice</p>
        <div class="invoice-form">
            <form action="/createinvoice" method="POST">
                <div class="invoice-form-wrapper">
                    <div class="BILL_TO">
                        <h3>BILL TO:</h3>
                        <label for="client_name" class="required" ><span></span> Client Name</label>
                        <input type="text" id="client_name" name="client_name" required>

                        <label for="email_address" class="required" ><span></span> Email Address</label>
                        <input type="email" id="email_address" name="email_address" required>

                        <label for="address" class="required" ><span></span> Address:</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>
                    
                    <div id="invoice_details">
                        <h3><span></span>Invoice Details</h3>
                        <div class="invoice_item">
                            <label for="invoice_number" ><span></span> Invoice Number</label>
                            <input type="text" id="invoice_number" name="invoice_number" required>
                            <label for="issue_date" class="required" ><span></span> Issue Date</label>
                    <input type="date" id="issue_date" name="issue_date" required>
                            <label for="due_date" class="required">Due Date</label>
                    <input type="date" id="due_date" name="due_date" required>
                            <h3>Invoice Items</h3>
                            <label for="invoice_itemdescription">Description:</label>
                            <input type="text" id="invoice_itemdescription" name="invoice_itemdescription" required>

                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" name="quantity" required>

                            <label for="price">Price:</label>
                            <input type="number" step="0.01" id="price" name="price" required>
                            <label for="total">Total</label>
                            <input type="number" step="0.01" id="total" name="total" required>
                            <button type="button" onclick="removeItem(this)">Remove</button>
                            <button type="button" onclick="addItem()">Add Item</button>
                            <input type="submit" value="Submit Invoice">
                    </div>
                </div>
        </div>
         </form>
    <!-- </div> -->
</body>
</html>
