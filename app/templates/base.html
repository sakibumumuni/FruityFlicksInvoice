<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.jpg') }}" type="image/x-icon">
    <title>MELS</title>
</head>
<body>
    <section class="container">
        <!-- The intro text -->
        <h1>Set Up Your Company Profile</h1>
        <p class="intro-text">Complete your company information to get started with MELS</p>
        <br>
        <!-- The form -->
        <section class="form-container">
            <form action="/userdata/v1.0" method = 'POST' enctype="multipart/form-data">
                <div class="form-wrapper">
                    <section class="form-inputs">
                        <p><label for="companyname" class="required">Company Name</label><input type="text" id="companyname" name="companyname" required placeholder="Enter company name"></p>
                        <p><label for="emailaddress" class="required">Email Address</label><input type="email" id="emailaddress" name="emailaddress" required placeholder="company@example.com"></p>
                        <p><label for="phonenumber" class="required">Phone Number</label><input type="tel" id="phonenumber" name="phonenumber" required placeholder="+233 020 000 000"></p>
                        <p><label for="address" class="required">Address</label><textarea id="address" name="address" required placeholder="Enter complete address"></textarea></p>
                        
                    </section>
                    <section class="company-uploads">
                        <div class="upload-box">
                            <label>
                                <input type="file" name="logo" id="logo" accept="image/png, image/jpeg" style="display: none;"> 
                                <span class="upload-label">Company Logo</span>
                            <div class="company-logo">
                                <span class="upload-text">Click to upload logo<br>PNG, JPG up to 5MB</span>
                                <img id="logo-preview" src="" alt="Logo preview" style="display:none; max-width:100%; max-height:100%;" />
                            </div>
                            </label>
                        </div>
                        <div class="upload-box">
                            <label>
                                <input type="file" name="signature" id="signature" accept="image/png, image/jpeg" style="display: none;">
                                <span class="upload-label">Digital Signature</span>
                                <div class="signature">
                                    <span class="upload-text">Click to upload signature<br>PNG, JPG up to 2MB</span>
                                    <img id="signature-preview" src="" alt="Signature preview" style="display:none; max-width:100%; max-height:100%;" />
                                </div>
                            </label>
                        </div>
                        <div class="company-extra">
                            <p><label for="taxid" class="required">Tax ID/Registration Number</label><input type="text" id="taxid" name="taxid" required></p>
                            <p class="section-heading">Financial Year</p>
                            <div class="financial-year">
                                <div class="date-field">
                                    <input type="date" id="financialyear-startdate" name="financialyear-startdate" required>
                                    <label for="financialyear-startdate">Start Date</label>
                                </div>
                                <div class="date-field">
                                    <input type="date" id="financialyear-enddate" name="financialyear-enddate" required>
                                    <label for="financialyear-enddate">End Date</label>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
        <button type="submit"><a href="dashboard.html">Submit and Continue</a></button>
            </form>
        </section>
    </section>
     <script src="/app/static/js/main.js"></script>
</body>
</html>
